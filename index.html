<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Hover — HTML e CSS</title>


  <link rel="stylesheet" href="estilo.css">
</head>


<body>
  <h1><span></span></h1>
  <p>Passe o mouse sobre os cartões ou use a tecla Tab.</p>


  <main class="container">


    <article class="card" tabindex="0"
      style="--cor: #000000;">
      <div class="frente">
        <span class="icone" aria-hidden="true">Deus</span>
      </div>


      <div class="verso">
        <h2>Deus</h2>
        <p></p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #000000;">
      <div class="frente">
        <span class="icone" aria-hidden="true">é</span>
      </div>


      <div class="verso">
        <h2>é</h2>
        <p></p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #000000;">
      <div class="frente">
        <span class="icone" aria-hidden="true">tudo</span>
      </div>


      <div class="verso">
        <h2>tudo</h2>
        <p></p>
      </div>
    </article>


  </main>
</body>
</html>
